<html lang="pt-BR">

<head>

<link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Cadastro de Colaborador</h1>
    </header>

  <nav class="menu">
    <button class="menu-hamburguer" type="button" aria-label="Abrir menu">
        ☰
    </button>

    <div class="menu-links">
        <a href="index.html">Início</a>

        <div class="dropdown">
            <a href="projetos.html">Projetos Sociais</a>

            <div class="submenu">
                <a href="projetos.html">Voluntariado</a>
                <a href="projetos.html">Doações</a>
            </div>
        </div>

        <a href="cadastro.html">Cadastro</a>
    </div>
</nav>

    <main>

        <h2>Faça seu cadastro</h2>

<div class="alerta" role="alert">
    <strong>Atenção:</strong> Preencha todos os campos obrigatórios antes de enviar o cadastro.
</div>

        <form>

            <fieldset>
    <legend>Dados pessoais</legend>

    <p>
        <label for="nome">Nome completo:</label>
        <input type="text" id="nome" name="nome" required>
    </p>

    <p>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required>
    </p>

    <p>
        <label for="nascimento">Data de nascimento:</label>
        <input type="date" id="nascimento" name="nascimento" required>
    </p>

    <p>
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf"
               maxlength="14"
               pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
               placeholder="000.000.000-00"
               required>
    </p>

    <p>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" name="telefone"
               maxlength="15"
               pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
               placeholder="(00) 00000-0000"
               required>
    </p>
</fieldset>

<fieldset>
    <legend>Dados de localização</legend>

    <p>
        <label for="cep">CEP:</label>
        <input type="text" id="cep" name="cep"
               maxlength="9"
               pattern="[0-9]{5}-[0-9]{3}"
               placeholder="00000-000"
               required>
    </p>

    <p>
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" name="endereco" required>
    </p>

    <p>
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" name="cidade" required>
    </p>

    <p>
        <label for="estado">Estado:</label>
        <input type="text" id="estado" name="estado" required>
    </p>
</fieldset>

<div class="acoes-formulario">
    <button type="submit">Enviar cadastro</button>
    <button type="button" id="limpar-cadastro">Limpar cadastro</button>
</div>

        </form>

<div id="toast" class="toast" role="status" aria-live="polite">
    Cadastro preenchido corretamente!
</div>

    </main>

    <footer>
        <p>ONG Solidariedade</p>
    </footer>
<script src="../js/script.js"></script>
</body>

</html>
